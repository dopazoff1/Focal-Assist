services:
  focalassist-api:
    build:
      context: ${BACKEND_CONTEXT:-../focal-assist-api}
      dockerfile: Dockerfile
    image: focalassist-api:latest
    env_file:
      - ${BACKEND_ENV_FILE:-../focal-assist-api/.env.oci}
    environment:
      SERVER_PORT: 8080
      TRAINING_ASSETS_DIR: /app/data/training-assets
    expose:
      - "8080"
    volumes:
      - focalassist_training_assets:/app/data/training-assets
    restart: unless-stopped

  focalassist-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: focalassist-web:latest
    environment:
      BACKEND_UPSTREAM: http://focalassist-api:8080
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - focalassist-api
    restart: unless-stopped

volumes:
  focalassist_training_assets:
