<div class="magic-container">
  <div class="magic-card" #magicCard>
    <div class="magic-loading-overlay" *ngIf="loading" aria-live="polite">
      <span class="magic-loading-label">Loading</span>
      <span class="magic-loading-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
    </div>

    <div class="top-bar">
      <button class="back-btn" *ngIf="!loading && !page.isStart" (click)="goBack()">&larr; Go Back</button>
      <div class="case-tag" *ngIf="!loading && page.tag && !page.isStart">{{ page.tag }}</div>
    </div>

    <h1>{{ page.name || 'MAGIC ASSISTANCE HOME' }}</h1>
    <div class="magic-content" [innerHTML]="pageContent"></div>

    <div class="issue-grid" *ngIf="hasChoices">
      <button
        class="issue-btn"
        *ngFor="let choice of pageChoices"
        (click)="selectChoice(choice)"
      >
        {{ choice.label }}
      </button>
    </div>

    <div class="magic-waiting" *ngIf="loading && !hasChoices" aria-live="polite">
      <div class="magic-spinner" aria-hidden="true"></div>
      <div class="magic-waiting-text">Loading process...</div>
    </div>

    <div *ngIf="!loading && !hasChoices && page.id > 0" class="terminal-msg">
      <h3>EOP - End of Process</h3>
    </div>
  </div>
</div>
