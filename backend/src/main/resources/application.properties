spring.application.name=creditplus-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/creditplus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,https://*.trycloudflare.com}
app.frame-ancestors=${APP_FRAME_ANCESTORS:'self' http://localhost:4200 http://127.0.0.1:4200}

gmail.client-id=${GMAIL_CLIENT_ID:}
gmail.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.redirect-uri=${GMAIL_REDIRECT_URI:${app.public-base-url}/api/gmail/oauth/callback}
gmail.scopes=${GMAIL_SCOPES:https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send}

security.jwt.secret=${SECURITY_JWT_SECRET:creditplus-change-this-secret-key-creditplus-change-this-secret}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:43200}
security.mfa.encryption-key=${SECURITY_MFA_ENCRYPTION_KEY:${security.jwt.secret}}

# Chat integrations
chat.public-base-url=${CHAT_PUBLIC_BASE_URL:${app.public-base-url}}
chat.meta.app-id=${CHAT_META_APP_ID:}
chat.meta.redirect-uri=${CHAT_META_REDIRECT_URI:${app.public-base-url}/api/crm/chats/oauth/callback}
chat.meta.oauth-url=${CHAT_META_OAUTH_URL:https://www.facebook.com/v21.0/dialog/oauth}
chat.meta.scopes=${CHAT_META_SCOPES:business_management,pages_show_list,pages_messaging,instagram_basic,instagram_manage_messages,whatsapp_business_management,whatsapp_business_messaging}
chat.meta.verify-token=${CHAT_META_VERIFY_TOKEN:focal-meta-verify-token}

# Process Assistant (ChatGPT)
openai.api-key=${OPENAI_API_KEY:}
openai.chat-completions-url=${OPENAI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
openai.default-model=${OPENAI_DEFAULT_MODEL:gpt-4o-mini}

# Training assets (server-side uploads)
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
training.assets.dir=${TRAINING_ASSETS_DIR:./data/training-assets}
training.assets.max-bytes=${TRAINING_ASSETS_MAX_BYTES:262144000}
